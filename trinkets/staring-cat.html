<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Staring Cat</title>
  <style>
    body { margin: 0; height: 100vh; display: grid; place-items: center;
           background: #1b1b2f; color: #fff; font-family: system-ui, sans-serif;
           overflow: hidden; cursor: crosshair; }
    .cat { position: relative; width: 260px; height: 220px; background: #111;
           border-radius: 50% 50% 45% 45%; }
    .cat::before, .cat::after { content: ""; position: absolute; top: -40px;
           border: 40px solid transparent; border-bottom: 70px solid #111; }
    .cat::before { left: 10px; transform: rotate(-15deg); }
    .cat::after { right: 10px; transform: rotate(15deg); }
    .eye { position: absolute; top: 70px; width: 70px; height: 70px;
           background: #f5d020; border-radius: 50%; overflow: hidden; }
    .eye.l { left: 40px; } .eye.r { right: 40px; }
    .pupil { position: absolute; left: 27px; top: 15px; width: 16px; height: 40px;
             background: #000; border-radius: 50%; }
    p { position: fixed; bottom: 24px; width: 100%; text-align: center; opacity: 0.6; }
    a { color: #f5d020; }
  </style>
</head>
<body>
  <div class="cat">
    <div class="eye l"><div class="pupil"></div></div>
    <div class="eye r"><div class="pupil"></div></div>
  </div>
  <p>It sees you. Click to make it blink. · <a href="../">back to the shelf</a></p>
  <script>
    const eyes = document.querySelectorAll(".eye");
    document.addEventListener("pointermove", (e) => {
      for (const eye of eyes) {
        const r = eye.getBoundingClientRect();
        const angle = Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2));
        eye.firstElementChild.style.transform =
          `translate(${Math.cos(angle) * 18}px, ${Math.sin(angle) * 12}px)`;
      }
    });
    document.addEventListener("click", () => {
      for (const eye of eyes) {
        eye.animate([{ height: "70px" }, { height: "4px", marginTop: "33px" }, { height: "70px" }],
                    { duration: 250 });
      }
    });
  </script>
</body>
</html>
