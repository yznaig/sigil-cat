<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sigil Cat</title>
  <style>
    :root { --bg: #fdf6e3; --ink: #2b2118; --accent: #d33682; --card: #fffbef; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font-family: "Comic Sans MS", "Comic Neue", system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px; text-align: center; }
    h1 { font-size: 3rem; margin: 0.2em 0; }
    h1 span { display: inline-block; animation: wobble 2s infinite ease-in-out; }
    @keyframes wobble { 50% { transform: rotate(-8deg) scale(1.1); } }
    .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
             gap: 16px; margin-top: 32px; }
    .shelf a { display: block; padding: 20px 12px; background: var(--card);
               border: 3px solid var(--ink); border-radius: 12px; color: inherit;
               text-decoration: none; box-shadow: 4px 4px 0 var(--ink); }
    .shelf a:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--accent); }
    .emoji { font-size: 2.5rem; display: block; }
    footer { margin-top: 48px; font-size: 0.85rem; opacity: 0.6; }
  </style>
</head>
<body>
  <main>
    <h1><span>🐈‍⬛</span> Sigil Cat <span>✨</span></h1>
    <p>A shelf of goofy trinkets. Click one.</p>
    <div class="shelf" id="shelf"></div>
    <footer>Under construction since forever.</footer>
  </main>
  <script src="trinkets.js"></script>
  <script>
    const shelf = document.getElementById("shelf");
    for (const t of TRINKETS) {
      const a = document.createElement("a");
      a.href = "trinkets/" + t.file;
      a.innerHTML = `<span class="emoji">${t.emoji}</span>${t.name}`;
      shelf.appendChild(a);
    }
  </script>
</body>
</html>
