<!doctype html>
<!--
  Sigil Cat: one near-blank page, the cat floating in the middle (docs/revamp-brief.md; the look is "Hush").
  src/main.js wires the core (src/core/: stage, cat, input, audio, saved state, keepsakes), the page's chrome
  (src/ui/hush.js), the sigils (src/sigils/), one file per egg (src/eggs/) and one per gag (src/gags/).
  Run locally: python3 tools/serve.py . 8732, then http://localhost:8732/
  URL options: ?perf=1 (frame times), #debug (readout and buttons), #yaw=-90, #pose=sleep, ?rm=1 (calm motion).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<!-- The loading screen's progress (src/ui/shell.js): real, not a timer. Each part is weighed by how long it keeps him
     away: the files on the way to his first frame (the modulepreloads below), the bytes of his first pose and its
     unpacking (the worker), the eggs and his first pose being built (src/main.js), the shader warm-ups drawn behind the
     closed doors (src/main.js, stage.warmAll), his first frame. -->
<script>
(() => {
  const W = { files: 25, splat: 40, eggs: 20, cat: 10, warm: 10, ready: 5 }, got = { files: 0, splat: 0, eggs: 0, cat: 0, warm: 0, ready: 0 };
  let shown = -1;
  const B = window.__boot = { history: [],
    set(k, v) { got[k] = Math.max(got[k] || 0, Math.min(1, +v || 0)); B.draw(); },
    get value() { let s = 0, t = 0; for (const k in W) { s += W[k] * got[k]; t += W[k]; } return s / t; },
    get parts() { return { ...got }; },
    draw() {
      const p = B.value, el = document.getElementById('loader');
      if (p <= shown || !el) return;   // a file that lands before the ring exists is drawn with the ring's first paint
      if (B.history.length < 400) B.history.push([Math.round(performance.now()), +p.toFixed(4)]);   // every value drawn, once
      shown = p;
      for (const c of el.querySelectorAll('.ring .fill')) c.style.strokeDashoffset = (100 - p * 100).toFixed(2);
      el.querySelectorAll('.ring .rune').forEach((r, i, all) => r.classList.toggle('lit', i < Math.floor(p * all.length + 1e-6)));
      const n = document.getElementById('load-pct'); if (n) n.textContent = String(Math.round(p * 100));
    },
  };
})();
</script>
<!-- His first pose starts downloading and unpacking now, in a worker, while the 3D library is still on its way
     (src/core/splats.js picks up the worker and the result). -->
<script>
try {
  const worker = new Worker('src/core/spz-worker.js', { type: 'module' }), url = new URL('assets/splats/sit.spz', document.baseURI).href;
  const s = window.__splat = { worker, url, dead: false };
  s.first = new Promise((done) => {
    worker.addEventListener('message', (e) => { if (e.data.of === 0) window.__boot.set('splat', e.data.progress * 0.8); if (e.data.id === 0) { window.__boot.set('splat', 1); done(e.data.error ? null : e.data); } });
    worker.addEventListener('error', () => { s.dead = true; done(null); });
  });
  worker.postMessage({ id: 0, url });
} catch (e) { /* no workers: the page unpacks him itself */ }
</script>

<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.js">

<script>
(() => {   // the files on the way to his first frame, as each one lands
  const links = [...document.querySelectorAll('link[rel=modulepreload]')], seen = new Set();
  const mark = (href) => { if (seen.has(href)) return; seen.add(href); window.__boot.set('files', seen.size / links.length); };
  for (const l of links) {
    if (performance.getEntriesByName(l.href).length) mark(l.href);
    else for (const t of ['load', 'error']) l.addEventListener(t, () => mark(l.href), { once: true });
  }
})();
</script>
</head>
<body>
<div class="wash" aria-hidden="true"></div>
<!-- The loading screen (src/ui/shell.js): two paper doors and a ring of his runes where he will appear. -->
<div id="loader" class="loader" aria-busy="true">
  <div class="door door-l" aria-hidden="true"><div class="seal-half"></div></div>
  <div class="door door-r" aria-hidden="true"><div class="seal-half"></div></div>
  <div class="loader-words"><p class="loader-name">Sigil Cat</p><p id="status" role="status">summoning the cat</p><p class="loader-pct" aria-hidden="true"><span id="load-pct">0</span>%</p></div>
</div>
<script>
(() => {   // the ring: a faint track, the line of progress, and 24 of his signs that light as it passes them
  const BASE = ['M4 6v8a4 4 0 0 0 8 0', 'M4 12h8a4 4 0 1 0-4 4', 'M3 7h9l-8 10h10', 'M3 18v-7a5 5 0 0 1 10 0v7', 'M3 6v6a5 5 0 0 0 10 0V6',
    'M12 7a6 6 0 1 0 1 8a3 3 0 1 0-5-2', 'M4 6v12M12 6v12M4 12h8', 'M12 7c-8-1-8 5-4 5s4 6-4 5', 'M4 8h8v8H4z', 'M8 5v13M3 9h10',
    'M2 12c3-6 5-6 7 0s4 6 6 0', 'M3 18l5-12 5 12', 'M8 7a5 5 0 1 0 .01 0'];
  let runes = '';
  for (let i = 0; i < 24; i++) runes += `<g class="rune" transform="rotate(${i * 15}) translate(0 -83) scale(.42) translate(-8 -12)"><path d="${BASE[(i * 5 + 3) % 13]}"/></g>`;
  const svg = `<svg class="ring" viewBox="-110 -110 220 220"><circle class="outer" r="104"/><circle class="track" r="96"/><circle class="fill" r="96" pathLength="100" transform="rotate(-90)"/>${runes}</svg>`;
  for (const h of document.querySelectorAll('#loader .seal-half')) h.innerHTML = svg;
  window.__boot.draw();
})();
</script>
