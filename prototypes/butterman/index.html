<!doctype html>
<!--
  Butterman prototype (sigil-cat). Throwaway: answers "does the gag read, and is it easy to retime?"
  Three scenes in a row (docs/ideas/butterman.md, decisions e1107-35, e1107-39): butter, cross, rise.
  The whole gag runs on ONE tempo: BUTTERMAN.bpm. Every start and length is a whole number of beats,
  every footfall lands on a beat, and changing bpm retimes motion, audio offsets and captions together.
  Motion is driven from the audio clock (audioCtx.currentTime - t0); it falls back to performance.now()
  when audio can't run (headless, no user gesture), so motion can't drift from sound.
  URL hash: #b=12.5 freezes the gag at beat 12.5 (or #t=6.2 for seconds)  #bpm=150 overrides the tempo
            #rm=1 forces reduced motion  #log shows the state panel.  Query: ?tune opens a lil-gui panel.
  The cat (primitives, pose clips, lighting) is copied from ../cat-viewer at commit 59af8f7, with
  rotation cut down to a left-right turntable (decision e1107-36).
  Placeholder clips: audio/*.wav, written by make-placeholder-audio.py. Checks: checks/*.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 35%, var(--bg-top), var(--bg-bottom));
    color: var(--ink);

    overflow: hidden;
    overscroll-behavior: none;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#c.dragging { cursor: grabbing; }
  .tag { position: fixed; top: 16px; left: 16px; margin: 0; font-size: 13px; color: var(--ink-soft); }
  .hint { position: fixed; top: 16px; right: 16px; margin: 0; font-size: 13px; color: var(--ink-soft); }
  .controls {

    background: var(--butter); color: var(--ink); cursor: pointer;

    font: 900 clamp(40px, 11vw, 140px)/1 "Arial Black", Impact, system-ui, sans-serif; letter-spacing: .02em;
    color: var(--butter); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
    text-shadow: 0 6px 0 var(--ink); opacity: 0; transform: translate(-50%, -50%);
  }
  #log {
    position: fixed; top: 40px; left: 16px; margin: 0; padding: 8px 10px; border-radius: 8px; max-width: calc(100vw - 32px);
    max-height: calc(100vh - 140px); overflow: auto;
    background: rgba(0,0,0,.8); color: #d8f5c8; font: 11px/1.4 ui-monospace, monospace; white-space: pre; z-index: 5;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",

<body>
<canvas id="c" aria-label="A black cat floating in the middle of the page. Drag left or right to turn him."></canvas>
<p class="tag">butterman, prototype</p>
<p class="hint">Drag to turn him.</p>
<div class="controls"><button id="go" type="button">Buttaman</button></div>
<p id="caption" aria-live="assertive"></p>
<pre id="log" hidden></pre>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ===========================================================================
// BUTTERMAN: the one config. Every start, length, ease, clip and caption is here.
//
// TEMPO. `bpm` sets the beat. Every start / length / offset below is in BEATS, so changing bpm
//   retimes the whole gag together: motion, footfalls, audio offsets, captions. He takes one step
//   per beat, so every footfall is on the beat.
// SCENES play in array order; reorder the array to reorder the gag.
//   scene.start  'auto' = right after the previous scene, plus `gap` beats; a number pins it (beats from the click).
//   scene.shift  whole beats; moves this scene and everything after it.
//   scene.length 'auto' = until its last action ends; a number holds the next scene back (or pulls it in).
// ACTIONS inside a scene play in order too.
//   action.start 'auto' = right after the previous action; a number pins it (beats from the scene's start).
//   action.shift whole beats (negative = overlap the previous action).
//   action.length whole beats. On walks it is also the number of steps.
//   action.easing a name from EASE below. On walks it shapes each step, so footfalls stay on the beat.
//   action.audio { file, offset (beats into the action, or 'hit'), trimStart / trimEnd (SECONDS into the
//                file: these trim the recording, so they don't scale with bpm; trimEnd null = to the end), gain }.
//                The file is never edited: trims and offsets are a virtual edit. null = silent.
//   action.caption { on, text, at (beats into the action, or 'hit'), hold (beats), size }.
//   action.do     what the action does (walk-in, hand-up, slap, walk-out, cross, rise, open, sink). Don't rename.
// ===========================================================================
const BUTTERMAN = {
  bpm: 120,
  metronome: false,         // true = a quiet tick on every beat (accent on each scene's first beat)
  metronomeGain: 0.12,
  nudge: 0.0,               // SECONDS; + = motion later than sound, whole gag (Bluetooth headphones)
  preroll: 0.12,            // SECONDS between the click and beat 0, so the first clip is never late
  gap: 1,                   // beats between auto-packed scenes

  scenes: [
    { // 1. Butter: struts on, hand up with the butter, slaps it on the cat's head, walks back off.
      id: 'butter', start: 'auto', shift: 0, length: 'auto',
      from: 'right',                                   // side he enters from (and leaves by)
      cat: { yaw: -0.45, ease: { length: 2, easing: 'sineInOut' }, pauseCycle: true },
      actions: [
        { id: 'walk-in', do: 'walk-in', start: 'auto', shift: 0, length: 6, easing: 'linear',
          audio: { file: 'audio/strut.wav', offset: 0, trimStart: 0, trimEnd: null, gain: 0.7 },
          caption: { on: false, text: '', at: 0, hold: 0, size: 1 } },
        { id: 'hand-up', do: 'hand-up', start: 'auto', shift: 0, length: 1, easing: 'backOut',
          raise: 0.5,       // beats for the hand to shoot up (then it hangs there, the anticipation)
          hover: 0.25,      // how high above the head he holds the butter (world units)
          audio: { file: 'audio/up.wav', offset: 0, trimStart: 0, trimEnd: null, gain: 0.8 },
          caption: { on: false, text: '', at: 0, hold: 0, size: 1 } },
        { id: 'slap', do: 'slap', start: 'auto', shift: 0, length: 1, easing: 'quadIn',
          hit: 0,           // beats into the action the butter lands (0 = on the beat)
          strike: 0.25,     // beats the downstroke takes, ending at the hit
          settle: 0.5,      // beats for the butter to slide onto its spot after the hit
          catStartle: { amount: 1, at: 'hit' },
          audio: { file: 'audio/plop.wav', offset: 'hit', trimStart: 0, trimEnd: null, gain: 1 },
          caption: { on: false, text: 'SLAP', at: 'hit', hold: 1, size: 0.7 } },
        { id: 'walk-out', do: 'walk-out', start: 'auto', shift: 0, length: 6, easing: 'linear',
          turn: 1,          // beats: the arm comes down and he about-faces, then the rest are steps away
          audio: { file: 'audio/exit.wav', offset: 1, trimStart: 0, trimEnd: null, gain: 0.6 },
          caption: { on: false, text: '', at: 0, hold: 0, size: 1 } },
      ],
    },
    { // 2. Cross: struts all the way across, right to left, in front of the cat.
      id: 'cross', start: 'auto', shift: 0, length: 'auto',
      from: 'right', depth: 1.5,                       // depth: how far in front of the cat he walks
      actions: [
        { id: 'cross', do: 'cross', start: 'auto', shift: 0, length: 10, easing: 'linear',
          audio: { file: 'audio/strut.wav', offset: 0, trimStart: 0, trimEnd: null, gain: 0.7 },
          caption: { on: false, text: '', at: 0, hold: 0, size: 1 } },
      ],
    },
    { // 3. Rise: slowly rises up huge in front of the screen, arms in a Y, then opens them wider twice.
      id: 'rise', start: 'auto', shift: 0, length: 'auto',
      fill: 0.92,                                      // how much of the screen he fills at full size
      actions: [
        { id: 'stage-1', do: 'rise', start: 'auto', shift: 0, length: 6, easing: 'sineInOut',
          move: 4,          // beats the move takes (here: the slow climb); the rest of the action holds
          arms: 28,         // degrees each arm is spread from straight up (28 = a Y)
          shake: 0.6,       // yell tremble while holding
          catStartle: { amount: 0.3, at: 4 },
          audio: { file: 'audio/buttaman-1.wav', offset: 4, trimStart: 0, trimEnd: null, gain: 0.8 },
          caption: { on: true, text: 'BUTTAMAN!', at: 4, hold: 1.8, size: 1 } },
        { id: 'stage-2', do: 'open', start: 'auto', shift: 0, length: 2, easing: 'backOut',
          move: 0.5, arms: 50, shake: 1.0,
          catStartle: { amount: 0.5, at: 0 },
          audio: { file: 'audio/buttaman-2.wav', offset: 0, trimStart: 0, trimEnd: null, gain: 0.9 },
          caption: { on: true, text: 'BUTTAMAN!!', at: 0, hold: 1.9, size: 1.2 } },
        { id: 'stage-3', do: 'open', start: 'auto', shift: 0, length: 3, easing: 'backOut',
          move: 0.5, arms: 80, shake: 1.7,
          catStartle: { amount: 0.9, at: 0 },
          audio: { file: 'audio/buttaman-3.wav', offset: 0, trimStart: 0, trimEnd: null, gain: 1 },
          caption: { on: true, text: 'BUTTAMAN!!!', at: 0, hold: 2.8, size: 1.45 } },
        { id: 'sink', do: 'sink', start: 'auto', shift: 0, length: 1, easing: 'quadIn',
          audio: { file: 'audio/sink.wav', offset: 0, trimStart: 0, trimEnd: null, gain: 0.7 },
          caption: { on: false, text: '', at: 0, hold: 0, size: 1 } },
      ],
    },
  ],

  footsteps: { on: true, file: 'audio/step.wav', gain: 0.45 },   // one tick per footfall (= per beat while walking)

  // The strut (Becker's proud walk + Williams' double bounce + a shrug a step). Lengths in figure units (~2 tall).
  strut: {
    stride: 0.62,          // shortest step; steps stretch if the walk needs more ground to get off-screen
    bounce: 0.07,          // how far the hips drop at each bounce
    bounceShape: 'double', // 'double' (two dips a step, the cartoon strut) | 'normal' | 'strut' (low on passing)
    lean: 0.22,            // radians the body leans back (proud)
    chinUp: 0.18,          // radians the head tips up
    kneeLift: 1.0,         // 1 = normal; higher = higher knees
    armSwing: 0.85,        // radians each arm swings either side
    armRaise: 0.25,        // radians the swing is centred in front of the body (arms high)
    armLead: 0.08,         // fraction of a two-step cycle the arms lead the legs (Becker: about two frames)
    contactHold: 0.45,     // 0..0.9: how long he lingers on each contact pose (slows the body there)
    stance: 0.6,           // fraction of a cycle each foot is planted
    shrug: 0.07,           // how high the shoulder on the landing side pops up each step
    shrugRoll: 0.12,       // radians the chest rolls with the shrug
    turnToCamera: 0.35,    // radians he is turned toward the camera so limbs separate
    blend: 0.5,            // beats to blend into a standing action's pose
  },
  // Background cameos (e1107-40): now and then he struts in small, far behind the cat, stands a moment,
  // and struts back out. They stop for good on this device once the visitor has summoned him.
  cameo: {
    on: true,
    chancePerSecond: 0.01,   // chance each second (checked every frame) once minGap has passed
    duration: 2,             // SECONDS he stands there (rounded to whole beats)
    minGap: 45,              // SECONDS between cameos (and after the page loads)
    scale: 0.5, depth: -6,   // small and far behind the cat
    from: 'left', stopAt: 0.7,   // stops this far from the centre toward his side (0 = centre, 1 = edge)
    storageKey: 'butterman.summoned',
  },
  figure: { scale: 1.3, reach: 0.6, standInFront: 0.2 },   // reach: how far from the cat's head he stands
  cat: { homeYaw: -0.65, startle: 1.5 },                     // startle: beats the cat's jump lasts
  captionStyle: { slam: 0.25, fade: 0.35 },                  // beats: slam-in and fade-out of captions
};

const EASE = {
  linear: (u) => u,
  sineIn: (u) => 1 - Math.cos(u * Math.PI / 2),
  sineOut: (u) => Math.sin(u * Math.PI / 2),
  sineInOut: (u) => 0.5 - 0.5 * Math.cos(Math.PI * u),
  quadIn: (u) => u * u,
  quadOut: (u) => 1 - (1 - u) ** 2,
  quadInOut: (u) => (u < 0.5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2),
  cubicOut: (u) => 1 - (1 - u) ** 3,
  cubicInOut: (u) => (u < 0.5 ? 4 * u ** 3 : 1 - (-2 * u + 2) ** 3 / 2),
  expoOut: (u) => (u >= 1 ? 1 : 1 - 2 ** (-10 * u)),
  backOut: (u) => 1 + 2.70158 * (u - 1) ** 3 + 1.70158 * (u - 1) ** 2,
  elasticOut: (u) => (u <= 0 ? 0 : u >= 1 ? 1 : 2 ** (-10 * u) * Math.sin((u * 10 - 0.75) * (2 * Math.PI / 3)) + 1),
};

// ---------------------------------------------------------------------------
// Small maths
// ---------------------------------------------------------------------------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clamp01 = (u) => clamp(u, 0, 1);
const smooth = (u) => { u = clamp01(u); return u * u * (3 - 2 * u); };
const ease = (name, u) => (EASE[name] || EASE.linear)(clamp01(u));
const lerp = (a, b, u) => a + (b - a) * u;
const frac = (x) => x - Math.floor(x);
const lerpAngle = (a, b, u) => a + Math.atan2(Math.sin(b - a), Math.cos(b - a)) * u;
const noise = (t, seed) => Math.sin(t * 26.1 + seed) * 0.6 + Math.sin(t * 45.7 + seed * 2.3) * 0.4;   // deterministic tremble
const spb = () => 60 / BUTTERMAN.bpm;            // seconds per beat
const hashParams = () => new URLSearchParams(location.hash.slice(1));
let params = hashParams();
if (params.has('bpm')) BUTTERMAN.bpm = Number(params.get('bpm'));
const reducedMotion = () => params.get('rm') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------------------
// Renderer, camera, light (from cat-viewer)
// ---------------------------------------------------------------------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.4;
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 60);
scene.add(new THREE.HemisphereLight(0xfff6e8, 0x3a3630, 0.7));
const key = new THREE.DirectionalLight(0xfff1dc, 2.2); key.position.set(3, 4, 5);
const rimA = new THREE.DirectionalLight(0xdfe8ff, 5.0); rimA.position.set(-4, 2.5, -4);
const rimB = new THREE.DirectionalLight(0xffffff, 3.0); rimB.position.set(4, 1, -3);
scene.add(key, rimA, rimB);

// One shared material: the cat and the stick figure are the same stuff.
const matte = new THREE.MeshPhysicalMaterial({
  color: 0x0d0d0f, roughness: 0.78, metalness: 0,
  sheen: 0.8, sheenRoughness: 0.5, sheenColor: new THREE.Color(0x4b505b),
});

function part(geo, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Mesh(geo, matte);
  m.position.set(x, y, z); m.scale.set(sx, sy, sz);
  return m;
}
function node(name, parent, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  const g = new THREE.Group();
  g.name = name; g.position.set(x, y, z); g.rotation.set(rx, ry, rz);
  parent.add(g);
  return g;
}
const sphere = (r) => new THREE.SphereGeometry(r, 32, 24);
const capsuleX = (r, len) => new THREE.CapsuleGeometry(r, len, 8, 20).rotateZ(Math.PI / 2);
const capsuleY = (r, len) => new THREE.CapsuleGeometry(r, len, 8, 16);

// ---------------------------------------------------------------------------
// The cat (copied from cat-viewer). Faces +X; the turntable spins it about Y only.
// ---------------------------------------------------------------------------
const spin = new THREE.Group();
const floater = node('floater', spin);
const react = node('react', floater);
const cat = node('cat', react);
scene.add(spin);

const body = node('body', cat);
body.add(part(sphere(0.5), 0, 0.02, 0, 1.62, 0.8, 0.8));
body.add(part(sphere(0.25), 0.6, 0.24, 0, 1.1, 1, 1));
const head = node('head', body, 0.84, 0.44, 0);
head.add(part(sphere(0.33), 0, 0, 0, 1.05, 0.9, 1));
head.add(part(sphere(0.15), 0.27, -0.09, 0, 1, 0.8, 1.15));
for (const [name, z, tilt] of [['earL', 0.19, 0.32], ['earR', -0.19, -0.32]]) {
  const ear = node(name, head, 0.02, 0.24, z, tilt, 0, -0.12);
  ear.add(part(new THREE.ConeGeometry(0.12, 0.27, 20), 0, 0.11, 0, 1, 1, 0.7));
}
for (const [name, x, y, z] of [['legFL', 0.48, -0.2, 0.19], ['legFR', 0.48, -0.2, -0.19], ['legBL', -0.5, -0.18, 0.2], ['legBR', -0.5, -0.18, -0.2]]) {
  const leg = node(name, body, x, y, z);
  leg.add(part(capsuleY(0.1, 0.48), 0, -0.32, 0));
  leg.add(part(sphere(0.11), 0.03, -0.6, 0, 1.3, 0.7, 1));
}
const TAIL = 7, SEG = 0.17;
let tparent = node('tail0', body, -0.78, 0.12, 0, 0, 0, -0.75);
tparent.add(part(capsuleX(0.075, SEG), -SEG / 2, 0, 0));
for (let i = 1; i < TAIL; i++) {
  const r = 0.075 - i * 0.004;
  tparent = node('tail' + i, tparent, -SEG, 0, 0, 0, 0, -0.13);
  tparent.add(part(sphere(r), 0, 0, 0));
  tparent.add(part(capsuleX(r, SEG), -SEG / 2, 0, 0));
}
const earL = head.getObjectByName('earL'), earR = head.getObjectByName('earR');

// The butter: lives in the figure's hand, then on the cat's head (Object3D.attach hand-off).
const butter = new THREE.Mesh(
  new RoundedBoxGeometry(0.34, 0.12, 0.22, 4, 0.025),
  new THREE.MeshStandardMaterial({ color: 0xf3d36b, roughness: 0.42 }),
);
butter.name = 'butter';
butter.visible = false;
const BUTTER_REST = { p: new THREE.Vector3(0.05, 0.34, 0), q: new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0.18, 0.06)) };

// Contact shadows
const shadowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(40,32,20,0.55)'); grad.addColorStop(1, 'rgba(40,32,20,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();
const GROUND = -1.55;
function blob(w, h) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = GROUND; scene.add(m);
  return m;
}
const shadow = blob(2.6, 1.3);
const figShadow = blob(1.3, 0.7);

// ---------------------------------------------------------------------------
// Cat poses and the pose cycle (trimmed copy of cat-viewer's player: auto cycle only).
// ---------------------------------------------------------------------------
const REST = {};
cat.traverse((o) => { if (o.name) REST[o.name] = { p: o.position.clone(), r: o.rotation.clone() }; });
const TAILS = Array.from({ length: TAIL }, (_, i) => 'tail' + i);
const PARTS = ['body', 'head', 'earL', 'earR', 'legFL', 'legFR', 'legBL', 'legBR', ...TAILS];
const legsP = (front, back, fl = 1, bl = 1) => ({
  legFL: { r: [0, 0, front], s: [1, fl, 1] }, legFR: { r: [0, 0, front], s: [1, fl, 1] },
  legBL: { r: [0, 0, back], s: [1, bl, 1] }, legBR: { r: [0, 0, back], s: [1, bl, 1] },
});
const tailP = (base, curl) => Object.fromEntries(TAILS.map((n, i) => [n, { r: i === 0 ? base : curl }]));
const POSE = {
  sit: { body: { p: [-0.1, -0.12, 0], r: [0, 0, 0.6] }, head: { p: [0.02, 0, 0], r: [0, 0, -0.5] }, ...legsP(-0.6, 0.95, 1.1, 0.6), ...tailP([0, 0.9, 1.2], [0, 0.25, 0.05]) },
  lie: { body: { p: [0, -0.22, 0], s: [1.04, 0.9, 1.1] }, head: { p: [-0.07, -0.1, 0], r: [0, 0, -0.12] }, ...legsP(-1.45, 1.45, 0.55, 0.55), ...tailP([0, 1.1, 0.55], [0, 0.28, 0.13]) },
  sleep: { body: { p: [0, -0.26, 0], s: [1, 0.86, 1.12] }, head: { p: [-0.12, -0.24, 0.08], r: [0.25, 0.55, -0.45] }, earL: { r: [0, 0, -0.3] }, earR: { r: [0, 0, -0.3] }, ...legsP(-1.45, 1.45, 0.55, 0.55), ...tailP([0, 1.5, 0.6], [0, 0.42, 0.12]) },
  stretch: { body: { p: [0, -0.05, 0], r: [0, 0, -0.35] }, head: { p: [0.04, -0.02, 0], r: [0, 0, 0.45] }, earL: { r: [0, 0, -0.2] }, earR: { r: [0, 0, -0.2] }, ...legsP(1.25, 0.15, 1.15, 1.05), ...tailP([0, 0, -0.55], [0, 0, 0.08]) },
};
const Z3 = [0, 0, 0], ONE = [1, 1, 1];
const getP = (pose, n) => ({ p: pose[n]?.p || Z3, r: pose[n]?.r || Z3, s: pose[n]?.s || ONE });
const mix3 = (a, b, u) => a.map((v, i) => v + (b[i] - v) * u);
function blendCat(a, b, u, lag = 0) {

  if (bo < 1) return { pos: c.stop.clone(), yaw: lerpAngle(c.pin.yaw, c.pout.yaw, smooth(bo)), pose: lerpPose(standPose(-1), walkPose(0, c.pout.S / s, -1), smooth(bo)), scale: s };
  if (bo < 1 + c.pout.N) return walkAlong(c.pout, bo - 1, 'linear', -1, s);
  cameo = null; lastCameoEnd = nowS;
  return null;
}

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
let lastNow = performance.now();
const showLog = params.has('log');
function frame(now) {
  const dt = Math.min((now - lastNow) / 1000, 0.1); lastNow = now;
  const gb = gagBeat();
  if (run) run.gb = gb;
  if (!press && Math.abs(yawVel) > 1e-4 && !catOwned()) { userYaw += yawVel * dt; yawVel *= Math.exp(-3.5 * dt); }
  const catTime = run && !run.live ? gb * spb() : now / 1000;
  catAt(catTime, gb, S, run, dt);

  if (run && gb !== null && gb >= 0) {
    const fs = figureAt(gb, S, run);
    applyFigure(fs);
    if (S.slap) placeButter(gb, S, run, fs, geometry(S.slap.scene, run).carry ?? 0);
    if (run.live) {
      let active = null;
      for (const a of S.actions) if (a.start <= gb) active = a;
      if (active && active.id !== run.active) { run.active = active.id; run.log.push({ action: active.id, beat: active.start, s: r3(active.start * spb()), seenAt: r3(gb * spb()) }); }
      if (gb > S.total + 0.5) finish();
    }
  } else {
    applyFigure(!run ? cameoAt(now / 1000, dt) : null);
    if (run && gb !== null && gb < 0) butter.visible = false;
    if (!run && !lastDone) butter.visible = false;            // before the first gag: plain cat
  }
  captionAt(run ? gb : null, S);

  body.getWorldPosition(_v);
  const lift = clamp(_v.y + 0.1, 0, 2);
  shadow.scale.setScalar(1 - lift * 0.25); shadow.material.opacity = 1 - lift * 0.35;
  figShadow.visible = fig.visible;
  if (fig.visible) {
    figShadow.position.set(fig.position.x, GROUND + 0.001, fig.position.z);
    figShadow.scale.setScalar(fig.scale.x / BUTTERMAN.figure.scale);
    const up = fig.position.y - GROUND;
    figShadow.material.opacity = up < -0.05 ? 0 : clamp(1 - up * 0.8, 0, 1);   // none while he rises from below
  }
  renderer.render(scene, camera);

  if (showLog) logEl.hidden = false;
  if (showLog && !logEl.dataset.force) logEl.textContent = JSON.stringify({ mode: state.mode, bpm: state.bpm, clock: state.clock, beat: gb === null ? null : +gb.toFixed(2), totalBeats: state.totalBeats, butterOnHead: state.butterOnHead, log: state.log }, null, 1);
}
renderer.setAnimationLoop(frame);
seekFromHash();

window.butterman = {
  play, seek, config: BUTTERMAN, state, buildSchedule, clipsReady,
  showText(text) { logEl.dataset.force = '1'; logEl.hidden = false; logEl.textContent = text; },
};

// ---------------------------------------------------------------------------
// ?tune: a lil-gui panel bound straight to BUTTERMAN, with Play and Copy config.
// ---------------------------------------------------------------------------
if (new URLSearchParams(location.search).has('tune')) {
  const { default: GUI } = await import('three/addons/libs/lil-gui.module.min.js');
  const gui = new GUI({ title: 'Butterman' });
  const eases = Object.keys(EASE);
  gui.add(BUTTERMAN, 'bpm', 60, 200, 1); gui.add(BUTTERMAN, 'metronome');
  gui.add(BUTTERMAN, 'nudge', -0.3, 0.3, 0.005); gui.add(BUTTERMAN, 'gap', 0, 8, 1);
  for (const sc of BUTTERMAN.scenes) {
    const f = gui.addFolder(`scene: ${sc.id}`).close();
    f.add(sc, 'shift', -8, 8, 1);
    if (sc.cat) f.add(sc.cat, 'yaw', -Math.PI, Math.PI, 0.01).name('cat yaw');
    for (const a of sc.actions) {
      const af = f.addFolder(a.id).close();
      af.add(a, 'shift', -8, 8, 1); af.add(a, 'length', 1, 16, 1); af.add(a, 'easing', eases);
      for (const k of ['raise', 'hit', 'strike', 'settle', 'move', 'turn']) if (typeof a[k] === 'number') af.add(a, k, 0, 8, 0.25);
      for (const k of ['arms']) if (typeof a[k] === 'number') af.add(a, k, 0, 90, 1);
      if (a.audio) { if (typeof a.audio.offset === 'number') af.add(a.audio, 'offset', -2, 8, 0.25).name('audio offset'); af.add(a.audio, 'trimStart', 0, 2, 0.005); af.add(a.audio, 'gain', 0, 2, 0.01); }
      if (a.caption) { af.add(a.caption, 'on').name('caption'); af.add(a.caption, 'text'); }
    }
  }
  const sf = gui.addFolder('strut').close();
  for (const [k, v] of Object.entries(BUTTERMAN.strut)) if (typeof v === 'number') sf.add(BUTTERMAN.strut, k, 0, k === 'contactHold' ? 0.9 : 2, 0.01);
  sf.add(BUTTERMAN.strut, 'bounceShape', ['double', 'normal', 'strut']);
  gui.add({ play: () => play() }, 'play').name('Play');
  gui.add({ copy: () => navigator.clipboard.writeText('const BUTTERMAN = ' + JSON.stringify(BUTTERMAN, null, 2) + ';') }, 'copy').name('Copy config');
}
</script>
