<!doctype html>
<!--
  Cat viewer prototype (sigil-cat). Throwaway: answers "does the recommended stack feel right?"
  Stack: vanilla three.js 0.186.1 from jsDelivr via an importmap. No build step.
  The cat is built from primitives (our own work, no license needed). Its clips are real
  THREE.AnimationClips played by a THREE.AnimationMixer, so the state machine below carries
  over unchanged when a rigged GLB replaces the placeholder: only the clip names change.
  URL hash options: #pose=sleep  #butter=1  #tone=agx  #debug  #t=1.5 (freeze that moment of
  the pose's hold, for repeatable screenshots)  (combine with &)
  Phone check: ?perf=1 shows fps, frame time, draw calls, pixel ratio and GPU on screen, and
  what the adaptive pixel ratio did. ?perf=1&dpr=1 pins the ratio; &burn=12 wastes 12 ms a
  frame to fake a slow phone on a desktop. (These also work after the #.)
  Checks: checks/*.js drive drag, tap, poses, emotes and butter through window.catViewer and print
  the results on the page. Run one with: shot 'index.html#debug' --js "$(cat checks/pose-cycle.js)"
  Primitive cat: our own work. Placeholder tap sounds are synthesized in code (no audio files).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cat Viewer</title>
<style>
  :root {
    --bg-top: #f6f1e7;
    --bg-bottom: #e7dfd0;
    --ink: #1a1a1c;
    --ink-soft: #6b665d;
    --pill: rgba(255, 255, 255, 0.72);
    --pill-on: #1a1a1c;
    --pill-on-ink: #f6f1e7;
    --butter: #f3d36b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 35%, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    font: 15px/1.4 ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  canvas#c {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: pan-y; cursor: grab;   /* sideways drags spin him; up-down swipes stay with the page */
  }
  canvas#c.dragging { cursor: grabbing; }
  .tag {
    position: fixed; top: 16px; left: 16px; margin: 0; font-size: 13px; color: var(--ink-soft);
  }
  .hint {
    position: fixed; top: 16px; right: 16px; margin: 0; font-size: 13px; color: var(--ink-soft);
  }
  .controls {
    position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%);
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    width: max-content; max-width: calc(100vw - 32px);
  }
  .controls button {
    font: inherit; font-size: 14px; border: 0; border-radius: 999px; padding: 8px 14px;
    background: var(--pill); color: var(--ink); cursor: pointer;
    box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
    backdrop-filter: blur(6px);
  }
  .controls button[aria-pressed="true"] { background: var(--pill-on); color: var(--pill-on-ink); }
  .controls button#butter[aria-pressed="true"] { background: var(--butter); color: var(--ink); }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex; gap: 18px; justify-content: center; font-size: 13px;
  }
  footer a { color: var(--ink-soft); text-decoration: none; }
  footer a:hover { color: var(--ink); text-decoration: underline; }
  #debug, #perf {
    position: fixed; top: 44px; left: 16px; margin: 0; padding: 8px 10px; border-radius: 8px;
    background: rgba(0,0,0,.75); color: #e9e4d8; font: 12px/1.45 ui-monospace, monospace; white-space: pre;
    pointer-events: none;
  }
  #perf { left: auto; right: 16px; top: calc(44px + env(safe-area-inset-top)); max-width: calc(100vw - 32px); overflow: hidden; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c" aria-label="A black cat floating in the middle of the page. Drag to spin him, tap him for a sound."></canvas>
<p class="tag">cat viewer, prototype</p>
<p class="hint">Drag to spin him. Tap him.</p>
<div class="controls" role="group" aria-label="Cat controls">
  <button data-pose="sit" aria-pressed="true">Sit</button>
  <button data-pose="lie" aria-pressed="false">Lie</button>
  <button data-pose="sleep" aria-pressed="false">Sleep</button>
  <button data-pose="stretch" aria-pressed="false">Stretch</button>
  <button id="hop">Hop</button>
  <button id="butter" aria-pressed="false">Butter</button>
  <button id="butterman">Buttaman</button>
  <button id="auto" aria-pressed="true">Auto</button>
</div>
<footer>
  <!-- Placeholder links: the real accounts are still to come from the brothers. -->
  <a href="#">instagram</a><a href="#">tiktok</a><a href="#">youtube</a>
</footer>
<pre id="debug" hidden></pre>
<pre id="perf" hidden></pre>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------------------------------------------------------------------------
// Tuning knobs. Everything worth fiddling with lives here.
// ---------------------------------------------------------------------------
const CONFIG = {
  // The pose cycle (spec: docs/ideas/cat-poses.md). He holds a pose for a random
  // time in `hold`, then picks the next by weight from `next`.
  cycle: {
    start: 'sit',
    poses: {
      sit: { hold: [4, 9], next: { lie: 3, stretch: 1 } },
      lie: { hold: [3, 7], next: { sleep: 3, sit: 2, stretch: 1 } },
      sleep: { hold: [8, 15], next: { lie: 1 } },
      stretch: { oneShot: true, then: 'sit' },   // stretch ends seated
    },
    // Transition clips, named from_to_to. Seconds here only size the placeholder
    // clips; a real model's clips bring their own length.
    transitions: { sit_to_lie: 1.1, sit_to_stretch: 0.9, lie_to_stretch: 1.1, lie_to_sleep: 1.3, lie_to_sit: 1.0, sleep_to_lie: 1.2 },
    fade: 0.25,                 // blend at each clip seam
    requestFade: 0.35,          // blend when a button cuts in mid-hold
    emoteFade: 0.2,             // blend into a full emote from wherever he is
    // Emotes. Two kinds:
    //   overlay: an additive add_* clip that rides on top of any pose and never stops the cycle.
    //   interrupt: an emote_* clip that takes over, plays once and ends on frame 0 of `returnTo`
    //   (a pose name, or 'same' = the pose he was in). `cooldown` is seconds before it can fire again.
    emotes: {
      hop:     { clip: 'add_hop', overlay: true },
      startle: { clip: 'add_startle', overlay: true },
      wake:    { clip: 'emote_wake', returnTo: 'lie' },
      spin:    { clip: 'emote_spin', returnTo: 'same', cooldown: 2 },
      flinch:  { clip: 'emote_flinch', returnTo: 'sit' },
    },
    // Site actions -> emote, per pose he is in (or landing in). A weights object picks at random.
    actions: {
      tap:       { sleep: 'wake', default: { hop: 4, spin: 1 } },
      butter:    { default: 'startle' },
      butterman: { default: 'flinch' },
    },
    // A full emote never cuts a transition (or another emote) mid-move: it waits here.
    // When the queue is full the newest emote replaces the last one waiting.
    queueMax: 2,
  },
  rotate: {
    radiansPerPixel: 0.009,     // drag sensitivity
    damping: 3.5,               // how fast a flick slows down (higher = sooner)
    tapSlop: 8,                 // pixels a press may move and still count as a tap
    tapMs: 450,                 // ...and how long it may last
    // Turntable only (Aaron, decision e1107-36): he spins around the vertical axis, all the way round.
    homeYaw: -0.65,             // the angle he faces at rest (a three-quarter view), radians
    returnHome: true,           // drift back to homeYaw after a spin (still undecided; flip to try)
    returnDelay: 2.5,           // seconds left alone before the drift starts
    returnSpeed: 1.6,           // how quickly he drifts back (higher = sooner)
  },
  float: { height: 0.08, speed: 1.2 },
  // Real sound files go here, e.g. ['sounds/mrrp.mp3', 'sounds/huh.mp3'].
  // Empty = synthesized placeholder blips so the prototype needs no assets.
  sounds: [],
  soundVolume: 0.5,
  // Adaptive pixel ratio. Every `sampleMs` it measures real fps; after `lowWindows` slow
  // samples in a row it steps the ratio down, after `highWindows` smooth ones it steps back up.
  // A step up that turns out too slow sets a ceiling, so it never see-saws.
  perf: { maxDpr: 2, minDpr: 1, step: 0.25, sampleMs: 1000, warmupMs: 2000, lowFps: 45, highFps: 57, lowWindows: 2, highWindows: 4 },
};

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.hash.slice(1));
const query = new URLSearchParams(location.search);
const opt = (k) => query.get(k) ?? params.get(k);     // ?perf=1 and #perf=1 both work

// ---------------------------------------------------------------------------
// Renderer, camera, light. Matte black needs light to read: a soft environment
// for the body, a warm key, and two strong back lights for the rim.
// ---------------------------------------------------------------------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
const deviceDpr = Number(opt('fakedpr')) || devicePixelRatio || 1;   // fakedpr: test the fallback on a 1x screen
const pinnedDpr = Number(opt('dpr')) || null;          // ?dpr=1.5 turns the adaptive ratio off
let dpr = pinnedDpr ?? Math.min(deviceDpr, CONFIG.perf.maxDpr);
renderer.setPixelRatio(dpr);
renderer.toneMapping = params.get('tone') === 'agx' ? THREE.AgXToneMapping : THREE.NeutralToneMapping;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.4;

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 60);

scene.add(new THREE.HemisphereLight(0xfff6e8, 0x3a3630, 0.7));
const key = new THREE.DirectionalLight(0xfff1dc, 2.2);
key.position.set(3, 4, 5);
const rimA = new THREE.DirectionalLight(0xdfe8ff, 5.0);
rimA.position.set(-4, 2.5, -4);
const rimB = new THREE.DirectionalLight(0xffffff, 3.0);
rimB.position.set(4, 1, -3);
scene.add(key, rimA, rimB);

// One shared material: the stick figure will reuse it so both read as the same stuff.
// Sheen gives black a velvet edge at grazing angles, which is what makes it read as soft.
const matte = new THREE.MeshPhysicalMaterial({
  color: 0x0d0d0f, roughness: 0.78, metalness: 0,
  sheen: 0.8, sheenRoughness: 0.5, sheenColor: new THREE.Color(0x4b505b),
});

// ---------------------------------------------------------------------------
// The placeholder cat. Every animated part is a named Object3D, exactly like
// bones in a rigged GLB, so AnimationClips can target them by name.
// Faces +X. Pivot sits at the body's centre so tumbling feels balanced.
// ---------------------------------------------------------------------------
function part(geo, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Mesh(geo, matte);
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  return m;
}
function node(name, parent, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  const g = new THREE.Group();
  g.name = name;
  g.position.set(x, y, z);
  g.rotation.set(rx, ry, rz);
  parent.add(g);
  return g;
}
const sphere = (r) => new THREE.SphereGeometry(r, 32, 24);
const capsuleX = (r, len) => new THREE.CapsuleGeometry(r, len, 8, 20).rotateZ(Math.PI / 2);
const capsuleY = (r, len) => new THREE.CapsuleGeometry(r, len, 8, 16);

const spin = new THREE.Group();          // user rotation (drag)
const floater = node('floater', spin);   // procedural bob
const react = node('react', floater);    // procedural tap squash
const cat = node('cat', react);          // mixer root
scene.add(spin);

const body = node('body', cat);
body.add(part(sphere(0.5), 0, 0.02, 0, 1.62, 0.8, 0.8));      // one smooth torso, no seams
body.add(part(sphere(0.25), 0.6, 0.24, 0, 1.1, 1, 1));         // neck

const head = node('head', body, 0.84, 0.44, 0);
head.add(part(sphere(0.33), 0, 0, 0, 1.05, 0.9, 1));
head.add(part(sphere(0.15), 0.27, -0.09, 0, 1, 0.8, 1.15));
for (const [name, z, tilt] of [['earL', 0.19, 0.32], ['earR', -0.19, -0.32]]) {
  const ear = node(name, head, 0.02, 0.24, z, tilt, 0, -0.12);
  ear.add(part(new THREE.ConeGeometry(0.12, 0.27, 20), 0, 0.11, 0, 1, 1, 0.7));
}

for (const [name, x, y, z] of [
  ['legFL', 0.48, -0.2, 0.19], ['legFR', 0.48, -0.2, -0.19],
  ['legBL', -0.5, -0.18, 0.2], ['legBR', -0.5, -0.18, -0.2],
]) {
  const leg = node(name, body, x, y, z);
  leg.add(part(capsuleY(0.1, 0.48), 0, -0.32, 0));
  leg.add(part(sphere(0.11), 0.03, -0.6, 0, 1.3, 0.7, 1));
}

const TAIL = 7, SEG = 0.17;
let parent = node('tail0', body, -0.78, 0.12, 0, 0, 0, -0.75);
parent.add(part(capsuleX(0.075, SEG), -SEG / 2, 0, 0));
for (let i = 1; i < TAIL; i++) {
  const r = 0.075 - i * 0.004;
  parent = node('tail' + i, parent, -SEG, 0, 0, 0, 0, -0.13);
  parent.add(part(sphere(r), 0, 0, 0));                        // joint ball hides the bend
  parent.add(part(capsuleX(r, SEG), -SEG / 2, 0, 0));
}

// Hit area: an invisible ellipsoid riding on the body. Taps test this, not the
// detailed meshes: cheaper, and a tap between the ears still counts.
const hitArea = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), matte);
hitArea.name = 'hitArea';
hitArea.position.set(0.1, 0.12, 0);
hitArea.scale.set(1.35, 0.75, 0.55);
hitArea.visible = false;                 // the raycaster ignores visibility, so it still gets hit
body.add(hitArea);

// Butter: its own mesh parented to the head, shown or hidden. With a real model
// this becomes headBone.add(butter), same idea.
const butter = new THREE.Mesh(
  new RoundedBoxGeometry(0.34, 0.12, 0.22, 4, 0.025),
  new THREE.MeshStandardMaterial({ color: 0xf3d36b, roughness: 0.42 }),
);
butter.name = 'butter';
butter.position.set(0.05, 0.34, 0);
butter.rotation.set(0, 0.18, 0.06);
butter.visible = false;
head.add(butter);

// Soft contact shadow: a blurred dot under him, in the world (not spun with him).
const shadowTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(40,32,20,0.55)');
  grad.addColorStop(1, 'rgba(40,32,20,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();
const shadow = new THREE.Mesh(
  new THREE.PlaneGeometry(2.6, 1.3),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }),
);
shadow.rotation.x = -Math.PI / 2;
shadow.position.y = -1.55;
scene.add(shadow);

// ---------------------------------------------------------------------------
// Poses and clips, authored in code. A real GLB ships the same clip names from
// Blender (sit, lie, sit_to_lie, add_hop...); the player below does not care
// where clips come from. A pose is offsets from the rest pose per named part:
//   p = position offset, r = rotation offset (radians), s = scale.
// ---------------------------------------------------------------------------
const REST = {};
cat.traverse((o) => { if (o.name) REST[o.name] = { p: o.position.clone(), r: o.rotation.clone() }; });
const TAILS = Array.from({ length: TAIL }, (_, i) => 'tail' + i);
const PARTS = ['body', 'head', 'earL', 'earR', 'legFL', 'legFR', 'legBL', 'legBR', ...TAILS];
const TAU = Math.PI * 2;

const legs = (front, back, frontLen = 1, backLen = 1) => ({
  legFL: { r: [0, 0, front], s: [1, frontLen, 1] }, legFR: { r: [0, 0, front], s: [1, frontLen, 1] },
  legBL: { r: [0, 0, back], s: [1, backLen, 1] }, legBR: { r: [0, 0, back], s: [1, backLen, 1] },
});
const tail = (base, curl) => Object.fromEntries(TAILS.map((n, i) => [n, { r: i === 0 ? base : curl }]));

const POSE = {
  sit: {
    body: { p: [-0.1, -0.12, 0], r: [0, 0, 0.6] },
    head: { p: [0.02, 0, 0], r: [0, 0, -0.5] },
    ...legs(-0.6, 0.95, 1.1, 0.6),
    ...tail([0, 0.9, 1.2], [0, 0.25, 0.05]),
  },
  lie: {                                            // the loaf
    body: { p: [0, -0.22, 0], s: [1.04, 0.9, 1.1] },
    head: { p: [-0.07, -0.1, 0], r: [0, 0, -0.12] },
    ...legs(-1.45, 1.45, 0.55, 0.55),
    ...tail([0, 1.1, 0.55], [0, 0.28, 0.13]),
  },
  sleep: {
    body: { p: [0, -0.26, 0], s: [1, 0.86, 1.12] },
    head: { p: [-0.12, -0.24, 0.08], r: [0.25, 0.55, -0.45] },
    earL: { r: [0, 0, -0.3] }, earR: { r: [0, 0, -0.3] },
    ...legs(-1.45, 1.45, 0.55, 0.55),
    ...tail([0, 1.5, 0.6], [0, 0.42, 0.12]),
  },
  stretch: {                                        // front stretch, rear up
    body: { p: [0, -0.05, 0], r: [0, 0, -0.35] },
    head: { p: [0.04, -0.02, 0], r: [0, 0, 0.45] },
    earL: { r: [0, 0, -0.2] }, earR: { r: [0, 0, -0.2] },
    ...legs(1.25, 0.15, 1.15, 1.05),
    ...tail([0, 0, -0.55], [0, 0, 0.08]),
  },
};

const Z3 = [0, 0, 0], ONE = [1, 1, 1];
const get = (pose, n) => ({ p: pose[n]?.p || Z3, r: pose[n]?.r || Z3, s: pose[n]?.s || ONE });
const mix3 = (a, b, u) => a.map((v, i) => v + (b[i] - v) * u);
const ease = (u) => u * u * (3 - 2 * u);
const clamp01 = (u) => Math.min(1, Math.max(0, u));
const rand = ([a, b]) => a + Math.random() * (b - a);

// Blend pose a toward b. With lag > 0 the head and tail trail the body a little
// (overlapping action), which is most of what makes a transition read as alive.
function blendPose(a, b, u, lag = 0) {
  const out = {};
  for (const n of PARTS) {
    const d = n.startsWith('tail') ? lag * (1 + Number(n.slice(4)) * 0.15) : n === 'head' ? lag * 0.5 : 0;
    const v = ease(clamp01((u - d) / (1 - d)));
    const A = get(a, n), B = get(b, n);
    out[n] = { p: mix3(A.p, B.p, v), r: mix3(A.r, B.r, v), s: mix3(A.s, B.s, v) };
  }
  return out;
}

// Bake fn(time) -> pose into a clip that drives every part, so any two clips blend cleanly.
function bake(name, duration, keys, fn) {
  const times = Array.from({ length: keys + 1 }, (_, k) => (k / keys) * duration);
  const frames = times.map(fn);
  const q = new THREE.Quaternion(), e = new THREE.Euler(), tracks = [];
  for (const n of PARTS) {
    const rest = REST[n], P = [], R = [], S = [];
    for (const f of frames) {
      const { p, r, s } = get(f, n);
      P.push(rest.p.x + p[0], rest.p.y + p[1], rest.p.z + p[2]);
      q.setFromEuler(e.set(rest.r.x + r[0], rest.r.y + r[1], rest.r.z + r[2]));
      R.push(q.x, q.y, q.z, q.w);
      S.push(...s);
    }
    tracks.push(new THREE.VectorKeyframeTrack(n + '.position', times, P),
      new THREE.QuaternionKeyframeTrack(n + '.quaternion', times, R),
      new THREE.VectorKeyframeTrack(n + '.scale', times, S));
  }
  return new THREE.AnimationClip(name, duration, tracks);
}

// A hold: the pose plus breathing, a lazy tail and a glance. Frame 0 is what the
// transitions start from and land on, so seams line up exactly.
function holdFn(pose, { period, breath, sway, look = 0 }) {
  return (t) => {
    const ph = t / period, f = blendPose(pose, pose, 1);
    const b = (0.5 - 0.5 * Math.cos(TAU * ph)) * breath;
    f.body.s = [f.body.s[0], f.body.s[1] * (1 + b), f.body.s[2] * (1 + 0.8 * b)];
    TAILS.forEach((n, i) => { f[n].r = [f[n].r[0], f[n].r[1] + sway * Math.sin(TAU * ph - i * 0.55), f[n].r[2]]; });
    f.head.r = [f.head.r[0], f.head.r[1] + look * Math.sin(TAU * ph), f.head.r[2]];
    return f;
  };
}
const HOLD = {
  sit: { period: 4, fn: holdFn(POSE.sit, { period: 4, breath: 0.025, sway: 0.18, look: 0.3 }) },
  lie: { period: 4.5, fn: holdFn(POSE.lie, { period: 4.5, breath: 0.03, sway: 0.08, look: 0.12 }) },
  sleep: { period: 5, fn: holdFn(POSE.sleep, { period: 5, breath: 0.05, sway: 0.03 }) },
};

// Stretch: push into it, tremble a little, then settle into the sit hold's first frame.
const STRETCH_LEN = 2.6;
function stretchFn(t) {
  if (t >= 1.8) return blendPose(POSE.stretch, HOLD.sit.fn(0), (t - 1.8) / 0.8, 0.2);
  const f = blendPose(POSE.stretch, POSE.stretch, 1), deep = Math.sin(Math.PI * t / 1.8);
  f.body.r = [0, 0, -0.35 - 0.12 * deep];
  f.legFL.r = f.legFR.r = [0, 0, 1.25 + 0.15 * deep + 0.02 * Math.sin(t * 45) * deep];
  return f;
}
const firstFrame = (p) => (p === 'stretch' ? stretchFn(0) : HOLD[p].fn(0));

// Additive overlays (add_*): small reactions that ride on top of whatever pose he is in.
// Full interrupts (emote_*) are ordinary clips that end on a named pose: see EMOTE_FN below.
function emoteClip(name, duration, fn) {
  const clip = bake(name, duration, 24, fn);        // offsets from rest; frame 0 must be rest
  THREE.AnimationUtils.makeClipAdditive(clip);      // now a delta from frame 0
  return clip;
}
const emoteHop = emoteClip('add_hop', 0.9, (t) => {
  const u = t / 0.9, up = Math.sin(Math.PI * clamp01((u - 0.15) / 0.6)), crouch = Math.sin(Math.PI * clamp01(u / 0.2));
  return {

  } else if (perf.high >= P.highWindows && dpr < Math.min(perf.ceiling, deviceDpr)) {
    setDpr(Math.min(perf.ceiling, deviceDpr, dpr + P.step), `smooth (${perf.fps.toFixed(0)} fps)`);
    perf.high = 0; perf.lastDir = 1;
  }
}
document.addEventListener('visibilitychange', () => { perf.last = 0; });

renderer.setAnimationLoop((now) => {
  perfFrame(now);
  if (burnMs) { const until = performance.now() + burnMs; while (performance.now() < until); }   // fake a slow phone
  timer.update(now);
  let dt = Math.min(timer.getDelta(), 0.1);     // a long stall never causes a big jump
  let t = timer.getElapsed();
  if (freezeAt !== null) { mixer.setTime(freezeAt); dt = 0; t = freezeAt; }
  frameMs += (dt * 1000 - frameMs) * 0.05;

  // A scene's angle wins; else flick inertia; else the optional drift back to face front.
  const R = CONFIG.rotate;
  if (faceYaw !== null) easeYawTo(faceYaw, 4, dt);
  else if (!press) {
    if (Math.abs(vel.x) > 1e-3) {
      rotateBy(vel.x * dt);
      vel.x *= Math.exp(-R.damping * dt);
    } else if (R.returnHome && performance.now() - lastTouch > R.returnDelay * 1000) {
      easeYawTo(R.homeYaw, R.returnSpeed, dt);
    }
  }

  if (auto && phase === 'hold' && t > holdUntil) waitingForSeam = true;
  mixer.update(dt);

  // Float bob (smaller when the visitor prefers less motion).
  const amp = CONFIG.float.height * (reducedMotion ? 0.3 : 1);
  floater.position.y = Math.sin(t * CONFIG.float.speed) * amp;
  floater.rotation.z = Math.sin(t * CONFIG.float.speed * 0.5) * 0.03;

  // Tap squash: a quick springy wobble on a group above the mixer root.
  if (squash) {
    squash.t += dt;
    const s = Math.exp(-squash.t * 7) * Math.sin(squash.t * 28) * 0.14;
    react.scale.set(1 + s, 1 - s, 1 + s);
    if (squash.t > 0.8) { react.scale.set(1, 1, 1); squash = null; }
  }

  // Butter drop-in: falls a little and overshoots its landing.
  if (butterAnim && butterAnim.t < 0.5) {
    butterAnim.t += freezeAt !== null ? 0.5 : dt;   // a frozen frame shows the butter landed
    const u = Math.min(butterAnim.t / 0.5, 1);
    const bounce = 1 + Math.sin(u * Math.PI) * 0.25 * (1 - u);
    butter.position.y = 0.34 + (1 - u) ** 2 * 0.6;
    butter.scale.set(bounce, 2 - bounce, bounce);
  }

  // Shadow follows his height: higher = smaller and fainter.
  body.getWorldPosition(tmpV);
  const lift = THREE.MathUtils.clamp(tmpV.y + 0.1, 0, 2);
  shadow.scale.setScalar(1 - lift * 0.25);
  shadow.material.opacity = 1 - lift * 0.35;

  renderer.render(scene, camera);

  if (showPerf) {
    const info = renderer.info.render, size = renderer.getDrawingBufferSize(tmpSize);
    perfEl.textContent =
      `fps     ${perf.fps ? perf.fps.toFixed(1) : '…'}\n` +
      `frame   ${perf.avg.toFixed(1)} ms avg, ${perf.worstMs.toFixed(1)} worst\n` +
      `calls   ${info.calls}   tris ${(info.triangles / 1000).toFixed(1)}k\n` +
      `dpr     ${dpr} of ${deviceDpr} ${pinnedDpr ? '(pinned)' : `(auto ${P.minDpr}-${Math.min(perf.ceiling, deviceDpr)})`}\n` +
      `canvas  ${size.x}×${size.y}\n` +
      `gpu     ${perf.gpu.slice(0, 40)}\n` +
      `device  ${perf.device}${perf.capped ? '\nnote    steady 30 fps: Low Power Mode?' : ''}` +
      (perf.events.length ? '\n' + perf.events.join('\n') : '');
  }

  if (showDebug) {
    const q = spin.quaternion;
    debugEl.textContent =
      `pose    ${phase} ${phase === 'emote' ? emoteNow + ' -> ' + emoteReturn : pose}${target ? ' -> ' + target : ''}${route.length ? ' (then ' + route.join(', ') + ')' : ''}\n` +
      `queue   ${queue.join(', ') || '-'}\n` +
      `next in ${phase === 'hold' && auto ? Math.max(0, holdUntil - t).toFixed(1) + ' s' + (waitingForSeam ? ' (at seam)' : '') : '-'}\nbutter  ${butter.visible}\nauto    ${auto}\ntaps    ${taps}\n` +
      `quat    ${q.x.toFixed(2)} ${q.y.toFixed(2)} ${q.z.toFixed(2)} ${q.w.toFixed(2)}\n` +
      `frame   ${frameMs.toFixed(1)} ms\ncalls   ${renderer.info.render.calls}  tris ${renderer.info.render.triangles}`;
  }
});

// A small handle for automated checks and console play.
window.catViewer = {
  request, emote, trigger, playEmote, setButter, rotateBy, faceTo, tap, config: CONFIG,
  get yaw() { return +yaw.toFixed(3); },
  get pose() { return pose; },
  get phase() { return phase; },
  get currentEmote() { return emoteNow; },
  get queue() { return [...queue]; },
  get emoteLog() { return [...emoteLog]; },
  get perf() { return { fps: +perf.fps.toFixed(1), dpr, ceiling: perf.ceiling, events: [...perf.events], gpu: perf.gpu }; },
  get butter() { return butter.visible; },
  get quaternion() { return spin.quaternion.toArray().map((v) => +v.toFixed(3)); },
  get taps() { return taps; },
  get sounds() { return pool.length; },
  set auto(v) { auto = v; syncButtons(); },
};
</script>
</body>
</html>
