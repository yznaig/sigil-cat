<!doctype html>
<!--
  SDF cat prototype (sigil-cat). Throwaway: answers "can a procedural, code-only cat replace the
  primitive placeholder with one smooth seamless body, without Blender or a bought model?"
  Copied from ../cat-viewer/index.html: same part hierarchy (now THREE.Bones), poses, clips, cycle
  player, emotes, turntable, tap, butter and ?perf=1 readout. Only how the body is drawn changes.
  The shape is one signed distance field (SDF): ellipsoids and round cones attached to the parts,
  joined with a polynomial smooth-min. Three ways to draw it, picked by hash:
    #mode=mesh  (default) polygonize the SDF once at load in the rest pose (surface nets), auto-skin
                it to the parts as bones from per-primitive distances, let the clips deform it.
                #res=0.032 sets the grid cell (world units; smaller = more triangles), #blend=0.08 the
                skin weight falloff.
    #mode=ray   raymarch the SDF every frame in a patched MeshPhysicalMaterial on a bounding-box
                proxy, part matrices sent as uniforms. Writes depth so the butter sits right.
                #rayScale=0.5 marches at half resolution and composites; #rayCull=0 turns off the
                per-primitive bounding-sphere cull; #rayHeat=1 paints march steps as a heatmap.
    #mode=prim  the original primitive cat, for side-by-side comparison.
  Other options as in the cat viewer: #pose=sleep #butter=1 #tone=agx #debug #t=1.5, ?perf=1.
  Checks: checks/*.js, run with: shot 'index.html#mode=mesh&debug' --js "$(cat checks/sdf-mesh.js)"
  All shapes are our own work; no assets.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SDF Cat</title>
<style>
  :root {
    --bg-top: #f6f1e7;
    --bg-bottom: #e7dfd0;
    --ink: #1a1a1c;
    --ink-soft: #6b665d;
    --pill: rgba(255, 255, 255, 0.72);
    --pill-on: #1a1a1c;
    --pill-on-ink: #f6f1e7;
    --butter: #f3d36b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 35%, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    font: 15px/1.4 ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  canvas#c {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: pan-y; cursor: grab;   /* sideways drags spin him; up-down swipes stay with the page */
  }
  canvas#c.dragging { cursor: grabbing; }
  .tag {
    position: fixed; top: 16px; left: 16px; margin: 0; font-size: 13px; color: var(--ink-soft);
  }
  .hint {
    position: fixed; top: 16px; right: 16px; margin: 0; font-size: 13px; color: var(--ink-soft);
  }
  .controls {
    position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%);
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    width: max-content; max-width: calc(100vw - 32px);
  }
  .controls button {
    font: inherit; font-size: 14px; border: 0; border-radius: 999px; padding: 8px 14px;
    background: var(--pill); color: var(--ink); cursor: pointer;
    box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
    backdrop-filter: blur(6px);
  }
  .controls button[aria-pressed="true"] { background: var(--pill-on); color: var(--pill-on-ink); }
  .controls button#butter[aria-pressed="true"] { background: var(--butter); color: var(--ink); }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex; gap: 18px; justify-content: center; font-size: 13px;
  }
  footer a { color: var(--ink-soft); text-decoration: none; }
  footer a:hover { color: var(--ink); text-decoration: underline; }
  #debug, #perf {
    position: fixed; top: 44px; left: 16px; margin: 0; padding: 8px 10px; border-radius: 8px;
    background: rgba(0,0,0,.75); color: #e9e4d8; font: 12px/1.45 ui-monospace, monospace; white-space: pre;
    pointer-events: none;
  }
  #perf { left: auto; right: 16px; top: calc(44px + env(safe-area-inset-top)); max-width: calc(100vw - 32px); overflow: hidden; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c" aria-label="A black cat floating in the middle of the page. Drag to spin him, tap him for a sound."></canvas>
<p class="tag">sdf cat, prototype <span id="modeTag"></span></p>
<p class="hint">Drag to spin him. Tap him.</p>
<div class="controls" role="group" aria-label="Cat controls">
  <button data-pose="sit" aria-pressed="true">Sit</button>
  <button data-pose="lie" aria-pressed="false">Lie</button>
  <button data-pose="sleep" aria-pressed="false">Sleep</button>
  <button data-pose="stretch" aria-pressed="false">Stretch</button>
  <button id="hop">Hop</button>
  <button id="butter" aria-pressed="false">Butter</button>
  <button id="butterman">Buttaman</button>
  <button id="auto" aria-pressed="true">Auto</button>
</div>
<footer>
  <!-- Placeholder links: the real accounts are still to come from the brothers. -->
  <a href="#">instagram</a><a href="#">tiktok</a><a href="#">youtube</a>
</footer>
<pre id="debug" hidden></pre>
<pre id="perf" hidden></pre>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------------------------------------------------------------------------
// Tuning knobs. Everything worth fiddling with lives here.
// ---------------------------------------------------------------------------
const CONFIG = {
  // The pose cycle (spec: docs/ideas/cat-poses.md). He holds a pose for a random
  // time in `hold`, then picks the next by weight from `next`.
  cycle: {
    start: 'sit',
    poses: {
      sit: { hold: [4, 9], next: { lie: 3, stretch: 1 } },
      lie: { hold: [3, 7], next: { sleep: 3, sit: 2, stretch: 1 } },
      sleep: { hold: [8, 15], next: { lie: 1 } },
      stretch: { oneShot: true, then: 'sit' },   // stretch ends seated
    },
    // Transition clips, named from_to_to. Seconds here only size the placeholder
    // clips; a real model's clips bring their own length.
    transitions: { sit_to_lie: 1.1, sit_to_stretch: 0.9, lie_to_stretch: 1.1, lie_to_sleep: 1.3, lie_to_sit: 1.0, sleep_to_lie: 1.2 },
    fade: 0.25,                 // blend at each clip seam
    requestFade: 0.35,          // blend when a button cuts in mid-hold
    emoteFade: 0.2,             // blend into a full emote from wherever he is
    // Emotes. Two kinds:
    //   overlay: an additive add_* clip that rides on top of any pose and never stops the cycle.
    //   interrupt: an emote_* clip that takes over, plays once and ends on frame 0 of `returnTo`
    //   (a pose name, or 'same' = the pose he was in). `cooldown` is seconds before it can fire again.
    emotes: {
      hop:     { clip: 'add_hop', overlay: true },
      startle: { clip: 'add_startle', overlay: true },
      wake:    { clip: 'emote_wake', returnTo: 'lie' },
      spin:    { clip: 'emote_spin', returnTo: 'same', cooldown: 2 },
      flinch:  { clip: 'emote_flinch', returnTo: 'sit' },
    },
    // Site actions -> emote, per pose he is in (or landing in). A weights object picks at random.
    actions: {
      tap:       { sleep: 'wake', default: { hop: 4, spin: 1 } },
      butter:    { default: 'startle' },
      butterman: { default: 'flinch' },
    },
    // A full emote never cuts a transition (or another emote) mid-move: it waits here.
    // When the queue is full the newest emote replaces the last one waiting.
    queueMax: 2,
  },
  rotate: {
    radiansPerPixel: 0.009,     // drag sensitivity
    damping: 3.5,               // how fast a flick slows down (higher = sooner)
    tapSlop: 8,                 // pixels a press may move and still count as a tap
    tapMs: 450,                 // ...and how long it may last
    // Turntable only (Aaron, decision e1107-36): he spins around the vertical axis, all the way round.
    homeYaw: -0.65,             // the angle he faces at rest (a three-quarter view), radians
    returnHome: true,           // drift back to homeYaw after a spin (still undecided; flip to try)
    returnDelay: 2.5,           // seconds left alone before the drift starts
    returnSpeed: 1.6,           // how quickly he drifts back (higher = sooner)
  },
  float: { height: 0.08, speed: 1.2 },
  // Real sound files go here, e.g. ['sounds/mrrp.mp3', 'sounds/huh.mp3'].
  // Empty = synthesized placeholder blips so the prototype needs no assets.
  sounds: [],
  soundVolume: 0.5,
  // Adaptive pixel ratio. Every `sampleMs` it measures real fps; after `lowWindows` slow
  // samples in a row it steps the ratio down, after `highWindows` smooth ones it steps back up.
  // A step up that turns out too slow sets a ceiling, so it never see-saws.
  perf: { maxDpr: 2, minDpr: 1, step: 0.25, sampleMs: 1000, warmupMs: 2000, lowFps: 45, highFps: 57, lowWindows: 2, highWindows: 4 },
};

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.hash.slice(1));
const query = new URLSearchParams(location.search);
const opt = (k) => query.get(k) ?? params.get(k);     // ?perf=1 and #perf=1 both work
const MODE = ['mesh', 'ray', 'prim'].includes(opt('mode')) ? opt('mode') : 'mesh';
document.getElementById('modeTag').textContent = '· ' + MODE;

// ---------------------------------------------------------------------------
// Renderer, camera, light. Matte black needs light to read: a soft environment
// for the body, a warm key, and two strong back lights for the rim.
// ---------------------------------------------------------------------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
const deviceDpr = Number(opt('fakedpr')) || devicePixelRatio || 1;   // fakedpr: test the fallback on a 1x screen
const pinnedDpr = Number(opt('dpr')) || null;          // ?dpr=1.5 turns the adaptive ratio off
let dpr = pinnedDpr ?? Math.min(deviceDpr, CONFIG.perf.maxDpr);
renderer.setPixelRatio(dpr);
renderer.toneMapping = params.get('tone') === 'agx' ? THREE.AgXToneMapping : THREE.NeutralToneMapping;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.4;

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 60);

const hemi = new THREE.HemisphereLight(0xfff6e8, 0x3a3630, 0.7);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff1dc, 2.2);
key.position.set(3, 4, 5);
const rimA = new THREE.DirectionalLight(0xdfe8ff, 5.0);
rimA.position.set(-4, 2.5, -4);
const rimB = new THREE.DirectionalLight(0xffffff, 3.0);
rimB.position.set(4, 1, -3);
scene.add(key, rimA, rimB);

// One shared material: the stick figure will reuse it so both read as the same stuff.
// Sheen gives black a velvet edge at grazing angles, which is what makes it read as soft.
const matte = new THREE.MeshPhysicalMaterial({
  color: 0x0d0d0f, roughness: 0.78, metalness: 0,
  sheen: 0.8, sheenRoughness: 0.5, sheenColor: new THREE.Color(0x4b505b),
});

// ---------------------------------------------------------------------------
// The placeholder cat. Every animated part is a named Object3D, exactly like
// bones in a rigged GLB, so AnimationClips can target them by name.
// Faces +X. Pivot sits at the body's centre so tumbling feels balanced.
// ---------------------------------------------------------------------------
const primMeshes = [];                   // the old primitive body, shown only in #mode=prim
function part(geo, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Mesh(geo, matte);
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  primMeshes.push(m);
  return m;
}
// Named parts are THREE.Bones so the generated skinned mesh can use them directly as its skeleton.
// The mixer still finds them by name, exactly as before.
function node(name, parent, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  const g = new THREE.Bone();
  g.name = name;
  g.position.set(x, y, z);
  g.rotation.set(rx, ry, rz);
  parent.add(g);
  return g;
}
const sphere = (r) => new THREE.SphereGeometry(r, 32, 24);
const capsuleX = (r, len) => new THREE.CapsuleGeometry(r, len, 8, 20).rotateZ(Math.PI / 2);
const capsuleY = (r, len) => new THREE.CapsuleGeometry(r, len, 8, 16);

const spin = new THREE.Group();          // user rotation (drag)
const floater = node('floater', spin);   // procedural bob
const react = node('react', floater);    // procedural tap squash
const cat = node('cat', react);          // mixer root
scene.add(spin);

const body = node('body', cat);
body.add(part(sphere(0.5), 0, 0.02, 0, 1.62, 0.8, 0.8));      // one smooth torso, no seams
body.add(part(sphere(0.25), 0.6, 0.24, 0, 1.1, 1, 1));         // neck

const head = node('head', body, 0.84, 0.44, 0);
head.add(part(sphere(0.33), 0, 0, 0, 1.05, 0.9, 1));
head.add(part(sphere(0.15), 0.27, -0.09, 0, 1, 0.8, 1.15));
for (const [name, z, tilt] of [['earL', 0.19, 0.32], ['earR', -0.19, -0.32]]) {
  const ear = node(name, head, 0.02, 0.24, z, tilt, 0, -0.12);
  ear.add(part(new THREE.ConeGeometry(0.12, 0.27, 20), 0, 0.11, 0, 1, 1, 0.7));
}

for (const [name, x, y, z] of [
  ['legFL', 0.48, -0.2, 0.19], ['legFR', 0.48, -0.2, -0.19],
  ['legBL', -0.5, -0.18, 0.2], ['legBR', -0.5, -0.18, -0.2],
]) {
  const leg = node(name, body, x, y, z);
  leg.add(part(capsuleY(0.1, 0.48), 0, -0.32, 0));
  leg.add(part(sphere(0.11), 0.03, -0.6, 0, 1.3, 0.7, 1));
}

const TAIL = 7, SEG = 0.17;
let parent = node('tail0', body, -0.78, 0.12, 0, 0, 0, -0.75);
parent.add(part(capsuleX(0.075, SEG), -SEG / 2, 0, 0));
for (let i = 1; i < TAIL; i++) {
  const r = 0.075 - i * 0.004;
  parent = node('tail' + i, parent, -SEG, 0, 0, 0, 0, -0.13);
  parent.add(part(sphere(r), 0, 0, 0));                        // joint ball hides the bend
  parent.add(part(capsuleX(r, SEG), -SEG / 2, 0, 0));
}

// Hit area: an invisible ellipsoid riding on the body. Taps test this, not the
// detailed meshes: cheaper, and a tap between the ears still counts.
const hitArea = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), matte);
hitArea.name = 'hitArea';
hitArea.position.set(0.1, 0.12, 0);
hitArea.scale.set(1.35, 0.75, 0.55);
hitArea.visible = false;                 // the raycaster ignores visibility, so it still gets hit
body.add(hitArea);

// Butter: its own mesh parented to the head, shown or hidden. With a real model
// this becomes headBone.add(butter), same idea.
const butter = new THREE.Mesh(
  new RoundedBoxGeometry(0.34, 0.12, 0.22, 4, 0.025),
  new THREE.MeshStandardMaterial({ color: 0xf3d36b, roughness: 0.42 }),
);
butter.name = 'butter';
butter.position.set(0.05, 0.34, 0);
butter.rotation.set(0, 0.18, 0.06);
butter.visible = false;
head.add(butter);

// Soft contact shadow: a blurred dot under him, in the world (not spun with him).
const shadowTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(40,32,20,0.55)');
  grad.addColorStop(1, 'rgba(40,32,20,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();
const shadow = new THREE.Mesh(
  new THREE.PlaneGeometry(2.6, 1.3),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }),
);
shadow.rotation.x = -Math.PI / 2;
shadow.position.y = -1.55;
scene.add(shadow);

// ===========================================================================
// THE SDF CAT. One shape, written as a signed distance field: ellipsoids and
// round cones pinned to the parts (in each part's local frame, rest pose),
// joined with a polynomial smooth-min so every joint blends without a seam.
// The same packed numbers feed the CPU polygonizer (mesh mode) and the GPU
// raymarcher (ray mode), so both modes draw exactly the same cat.
// ===========================================================================
const BONES = ['body', 'head', 'earL', 'earR', 'legFL', 'legFR', 'legBL', 'legBR', ...Array.from({ length: TAIL }, (_, i) => 'tail' + i)];
const boneObj = Object.fromEntries(BONES.map((n) => [n, cat.getObjectByName(n)]));
const tailR = (i) => 0.068 - i * 0.0047;              // tail radius at joint i (tip ~0.035)
const EAR_FLAT = 0.62;
const TAIL_SUB = 2;                                    // cones per tail bone                                  // ears are thin front-to-back
const SHAPE = {
  // Ellipsoids: part, centre, radii, blend k (how soft its join with everything before it is).
  ell: [
    { part: 'body', c: [0.3, 0.04, 0], r: [0.47, 0.36, 0.33], k: 0.1 },           // chest
    { part: 'body', c: [-0.35, 0.03, 0], r: [0.5, 0.37, 0.36], k: 0.2 },          // belly and hips
    { part: 'head', c: [-0.01, 0.02, 0], r: [0.28, 0.26, 0.3], k: 0.1 },          // skull
    { part: 'head', c: [0.06, -0.09, 0], r: [0.22, 0.18, 0.3], k: 0.1 },          // cheeks
    { part: 'head', c: [0.21, -0.1, 0], r: [0.11, 0.085, 0.13], k: 0.06 },        // muzzle
    ...['legBL', 'legBR'].map((part) => ({ part, c: [0.03, -0.1, 0], r: [0.19, 0.25, 0.13], k: 0.12 })),   // haunches
    ...['legFL', 'legFR', 'legBL', 'legBR'].map((part) => ({ part, c: [0.04, -0.6, 0], r: [0.12, 0.07, 0.095], k: 0.06 })),   // paws
  ],
  // Ears: a round cone up the ear's local y, flattened front-to-back.
  ear: ['earL', 'earR'].map((part) => ({ part, y0: -0.06, h: 0.25, rb: 0.12, rt: 0.03, k: 0.035 })),
  // Round cones between two points, each point pinned to its own part (the neck spans body -> head).
  cone: [
    { a: ['body', [0.46, 0.18, 0]], ra: 0.18, b: ['head', [-0.1, -0.07, 0]], rb: 0.16, k: 0.12 },   // neck
    ...['legFL', 'legFR', 'legBL', 'legBR'].map((leg) => ({ a: [leg, [0, -0.02, 0]], ra: 0.095, b: [leg, [0.01, -0.55, 0]], rb: 0.075, k: 0.09 })),
    // Tail: TAIL_SUB short cones per tail bone, laid along a Catmull-Rom curve through the joints, so a
    // curled tail is a smooth curve, not a chain of straight sticks. Joints share round ends: no blend.
    ...Array.from({ length: TAIL * TAIL_SUB }, (_, n) => {
      const i = Math.floor(n / TAIL_SUB), u0 = (n % TAIL_SUB) / TAIL_SUB, u1 = u0 + 1 / TAIL_SUB;
      const r = (u) => tailR(i) + (tailR(i + 1) - tailR(i)) * u;
      return { tail: [i, u0, u1], a: ['tail' + i], b: ['tail' + i], ra: r(u0), rb: r(u1), k: n ? 0.002 : 0.1 };
    }),
  ],
};
const NE = SHAPE.ell.length, NR = SHAPE.ear.length, NC = SHAPE.cone.length, NP = NE + NR + NC;
// A primitive can still shape the surface while a LATER primitive's blend is wider than its own,
// so the ray cull grows each bounding sphere by the widest blend from it onward.
const KREACH = (() => {
  const ks = [...SHAPE.ell, ...SHAPE.ear, ...SHAPE.cone].map((e) => e.k);
  for (let i = ks.length - 2; i >= 0; i--) ks[i] = Math.max(ks[i], ks[i + 1]);
  return ks;
})();

// Pack the shape for one pose. matOf(name) gives a part's matrix in the space we work in
// (cat space for the mesh, world space for the raymarcher). Per primitive:
//   E (ellipsoid, 5 vec4): 3 rows of world->local, (radii, k), bounding sphere
//   R (ear, 5 vec4): 3 rows of world->local, (h, r base, r tip, k), bounding sphere
//   C (cone, 4 vec4): (a, ra), (b, rb), (k, -, -, -), bounding sphere
function makePack() {
  return { E: new Float32Array(NE * 20), R: new Float32Array(NR * 20), C: new Float32Array(NC * 16), lo: new THREE.Vector3(), hi: new THREE.Vector3() };
}
const _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _a = new THREE.Vector3(), _b = new THREE.Vector3();
const _m4 = new THREE.Matrix4(), ONE3 = new THREE.Vector3(1, 1, 1);
function rows(arr, o, m) {
  const e = m.elements;
  arr[o] = e[0]; arr[o + 1] = e[4]; arr[o + 2] = e[8]; arr[o + 3] = e[12];
  arr[o + 4] = e[1]; arr[o + 5] = e[5]; arr[o + 6] = e[9]; arr[o + 7] = e[13];
  arr[o + 8] = e[2]; arr[o + 9] = e[6]; arr[o + 10] = e[10]; arr[o + 11] = e[14];
}
const tailJ = Array.from({ length: TAIL + 3 }, () => new THREE.Vector3());
// Point on the tail curve in segment j (joint j to j+1) at u in 0..1. tailJ is offset by one (ghost ends).
function catmull(j, u, out) {
  const p0 = tailJ[j], p1 = tailJ[j + 1], p2 = tailJ[j + 2], p3 = tailJ[j + 3], u2 = u * u, u3 = u2 * u;
  const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u2 + (-a + 3 * b - 3 * c + d) * u3);
  return out.set(f(p0.x, p1.x, p2.x, p3.x), f(p0.y, p1.y, p2.y, p3.y), f(p0.z, p1.z, p2.z, p3.z));
}
function packShape(matOf, out) {
  out.lo.setScalar(Infinity); out.hi.setScalar(-Infinity);
  const grow = (c, r) => { out.lo.min(_p.copy(c).subScalar(r)); out.hi.max(_p.copy(c).addScalar(r)); };
  SHAPE.ell.forEach((e, i) => {
    const M = matOf(e.part), o = i * 20;
    M.decompose(_p, _q, _s);
    _a.fromArray(e.c).applyMatrix4(M);
    const rx = e.r[0] * _s.x, ry = e.r[1] * _s.y, rz = e.r[2] * _s.z, R = Math.max(rx, ry, rz);
    rows(out.E, o, _m4.compose(_a, _q, ONE3).invert());
    out.E[o + 12] = rx; out.E[o + 13] = ry; out.E[o + 14] = rz; out.E[o + 15] = e.k;
    out.E[o + 16] = _a.x; out.E[o + 17] = _a.y; out.E[o + 18] = _a.z; out.E[o + 19] = R + KREACH[i];

// A small handle for automated checks and console play.
window.catViewer = {
  request, emote, trigger, playEmote, setButter, rotateBy, faceTo, tap, config: CONFIG,
  get yaw() { return +yaw.toFixed(3); },
  get pose() { return pose; },
  get phase() { return phase; },
  get currentEmote() { return emoteNow; },
  get queue() { return [...queue]; },
  get emoteLog() { return [...emoteLog]; },
  get perf() { return { fps: +perf.fps.toFixed(1), dpr, ceiling: perf.ceiling, events: [...perf.events], gpu: perf.gpu }; },
  get butter() { return butter.visible; },
  get quaternion() { return spin.quaternion.toArray().map((v) => +v.toFixed(3)); },
  get taps() { return taps; },
  get sounds() { return pool.length; },
  set auto(v) { auto = v; syncButtons(); },
  // SDF cat
  mode: MODE,
  get sdf() { return sdfStats; },
  rayStats,
  // World positions of the skinned mesh's vertices `ids` in the current pose (CPU skinning).
  skinnedPositions(ids) {
    if (!sdfMesh) return null;
    spin.updateMatrixWorld(true);
    sdfMesh.skeleton.update();
    const v = new THREE.Vector3();
    return ids.map((i) => sdfMesh.getVertexPosition(i, v).applyMatrix4(sdfMesh.matrixWorld).toArray());
  },
  // Bake the generated cat, its bones and every clip into one GLB (proof that the site could ship
  // a file instead of the generator). Returns the byte size; download=true also saves it.
  async exportGLB(download = false) {
    if (!sdfMesh) return null;
    const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
    // onlyVisible (the default) leaves out the hidden primitives, hit area and butter.
    const glb = await new GLTFExporter().parseAsync(cat, { binary: true, animations: clips.filter((c) => !c.name.startsWith('add_')) });
    if (download) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
      a.download = 'sdf-cat.glb'; a.click();
    }
    return glb.byteLength;
  },
};
</script>
